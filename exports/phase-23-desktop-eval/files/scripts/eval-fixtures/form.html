<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Eval signup form</title>
<style>
  body { font-family: sans-serif; max-width: 480px; margin: 48px auto; }
  label { display: block; margin: 12px 0 4px; font-weight: bold; }
  input { width: 100%; padding: 8px; font-size: 16px; }
  button { margin-top: 16px; padding: 10px 24px; font-size: 16px; }
</style>
</head>
<body>
<main>
  <h1>Conference signup</h1>
  <form action="form-success.html" method="get" id="signup">
    <label for="first-name">First name</label>
    <input id="first-name" name="first" type="text" autocomplete="off" required>
    <label for="last-name">Last name</label>
    <input id="last-name" name="last" type="text" autocomplete="off" required>
    <label for="email">Email address</label>
    <input id="email" name="email" type="email" autocomplete="off" required>
    <button type="submit">Submit application</button>
  </form>
</main>
</body>
</html>
